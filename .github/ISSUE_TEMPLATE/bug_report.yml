name: 🐛 Bug report
description: Report a Copilotix desktop problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove API keys and private document content from attachments.
  - type: input
    id: version
    attributes:
      label: Copilotix version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. For parser issues, attach only a document you may share.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and screenshots
      description: Remove tokens, personal information and confidential documents.
