name: Lite renderer diagnostic
on:
  pull_request:
    paths: ['.github/workflows/lite-renderer-diagnostic.yml', 'desktop/scripts/diagnose-installed-lite.ps1']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Download previously verified binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 42444892428 --repo Kumiko-kmk/Copilotix --name Copilotix-Lite-Windows-x64 --dir diagnostic-input
      - name: Compare isolated runtime conditions
        shell: pwsh
        run: ./desktop/scripts/diagnose-installed-lite.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lite-renderer-diagnostic
          path: diagnostic-evidence
