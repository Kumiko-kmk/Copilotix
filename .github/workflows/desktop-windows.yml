name: Desktop Windows

on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
  pull_request:
    # The protected master branch requires build for every pull request.
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Run coverage, all UI/E2E tests and installation acceptance'
        type: boolean
        default: false

# Keep PR merge checks separate from push checks. Never interrupt a master or tag release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Maintainer-authorized exceptions require an exact tag and repository variable.
  # Every other public tag still requires trusted signing.
  COPILOTIX_AUTHORIZED_UNSIGNED_RELEASE: ${{ (github.ref == 'refs/tags/desktop-v1.0.0' && vars.COPILOTIX_UNSIGNED_BOOTSTRAP_RELEASE == 'desktop-v1.0.0') || (github.ref == 'refs/tags/desktop-v1.1.0' && vars.COPILOTIX_UNSIGNED_RELEASE_TAG == 'desktop-v1.1.0') || (github.ref == 'refs/tags/desktop-v1.2.0' && vars.COPILOTIX_UNSIGNED_RELEASE_TAG == 'desktop-v1.2.0') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FULL_VALIDATION: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.full_validation) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: node desktop/scripts/verify-release-tag.mjs
      - name: Verify desktop release license
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: node desktop/scripts/verify-release-license.mjs
      - name: Require a signing certificate for a production release
        if: startsWith(github.ref, 'refs/tags/desktop-v') && env.COPILOTIX_AUTHORIZED_UNSIGNED_RELEASE != 'true'
        run: node desktop/scripts/verify-release-signing.mjs
        env:
          COPILOTIX_RELEASE_MODE: production
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:lint
      - run: pnpm desktop:typecheck
      - name: Fast core regression
        if: env.FULL_VALIDATION != 'true'
        run: pnpm desktop:test
      - name: Full regression and coverage
        if: env.FULL_VALIDATION == 'true'
        run: pnpm desktop:test:coverage
      - run: pnpm desktop:build:bundles
      - name: Source application smoke
        if: env.FULL_VALIDATION != 'true'
        run: pnpm desktop:test:e2e
      - name: Package verified compact Windows installation bundle
        if: env.FULL_VALIDATION == 'true'
        run: pnpm desktop:release:from-built
        env:
          COPILOTIX_RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && env.COPILOTIX_AUTHORIZED_UNSIGNED_RELEASE != 'true' && 'production' || 'development' }}
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Verify published release and select compact archive
        if: env.FULL_VALIDATION == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($required in @('release/setup.exe', 'release/uninstall.exe', 'release/advanced/release-manifest.json')) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Release publication failed: missing $required" }
          }
          $manifest = Get-Content -LiteralPath 'release/advanced/release-manifest.json' -Raw | ConvertFrom-Json
          $archive = [IO.Path]::GetFullPath((Join-Path (Join-Path 'release' $manifest.artifactDirectory) $manifest.transport.file))
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Verified compact archive is missing.' }
          "COPILOTIX_RELEASE_ZIP=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Full Electron regression
        if: env.FULL_VALIDATION == 'true'
        run: pnpm desktop:test:e2e:full
      - name: Verify install, upgrade, uninstall and reinstall with isolated data
        if: env.FULL_VALIDATION == 'true'
        shell: pwsh
        run: ./desktop/scripts/test-installer-lifecycle.ps1
      - name: Verify bundle download, integrity, extraction and deletion
        if: env.FULL_VALIDATION == 'true'
        run: pnpm desktop:test:release-download:install
      - uses: actions/upload-artifact@v4
        if: env.FULL_VALIDATION == 'true'
        with:
          name: Copilotix-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/setup.exe
            release/uninstall.exe
            release/安装说明.txt
            release/advanced/SHA256SUMS.txt
            release/advanced/release-manifest.json
      - uses: actions/upload-artifact@v4
        if: env.FULL_VALIDATION == 'true'
        with:
          name: Copilotix-Windows-x64-Bundle
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.COPILOTIX_RELEASE_ZIP }}

      - name: Preserve Windows verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Copilotix-Windows-verification-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            desktop/test-results/
            desktop/unit-test-results/
            desktop/coverage/coverage-summary.json

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          name: Copilotix-Windows-x64
          path: release
      - name: Create or reuse a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $existingJson = & gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) { throw "Release $tag already exists and is published; refusing to replace it." }
          } else {
            $version = $tag.Substring('desktop-v'.Length)
            $notesPath = Join-Path 'docs/releases' "$version.zh-CN.md"
            if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) { throw "Missing Simplified Chinese release notes: $notesPath" }
            $releaseTitle = (Get-Content -LiteralPath $notesPath -Encoding utf8 -TotalCount 1) -replace '^#\s*(?:🎉\s*)?', ''
            & gh release create $tag --repo $repo --draft --verify-tag --notes-file $notesPath --title $releaseTitle
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload the verified installer to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath 'release/advanced/release-manifest.json' -Raw | ConvertFrom-Json
          $installer = Join-Path 'release' $manifest.installer.file
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Verified Setup is missing.' }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $manifest.installer.sha256) { throw 'Setup hash does not match the build manifest.' }
          if ($env:COPILOTIX_AUTHORIZED_UNSIGNED_RELEASE -ne 'true') {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) { throw "Setup Authenticode signature is not valid: $($signature.Status)" }
          }
          & gh release upload $env:GITHUB_REF_NAME $installer --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the installer download, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $releaseJson = & gh release view $tag --repo $repo --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release $tag stopped being a draft before asset verification." }
          # Source archives are supplied by GitHub from the release tag.
          $env:COPILOTIX_RELEASE_ASSET_NAMES_JSON = ConvertTo-Json -InputObject @($release.assets | ForEach-Object { $_.name }) -Compress
          node desktop/scripts/verify-release-assets.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteAssetDirectory = 'release-remote-assets'
          New-Item -ItemType Directory -Force -Path $remoteAssetDirectory | Out-Null
          & gh release download $tag --repo $repo --dir $remoteAssetDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteFiles = @(Get-ChildItem -LiteralPath $remoteAssetDirectory -File)
          if ($remoteFiles.Count -ne 1 -or $remoteFiles[0].Name -ne 'setup.exe') { throw 'Expected only the Setup release asset.' }
          $manifest = Get-Content -LiteralPath 'release/advanced/release-manifest.json' -Raw | ConvertFrom-Json
          $localInstaller = Join-Path 'release' $manifest.installer.file
          $localHash = (Get-FileHash -LiteralPath $localInstaller -Algorithm SHA256).Hash
          $remoteHash = (Get-FileHash -LiteralPath $remoteFiles[0].FullName -Algorithm SHA256).Hash
          if ($localHash -ne $manifest.installer.sha256 -or $localHash -ne $remoteHash) { throw 'Uploaded Setup hash mismatch.' }
          if ($env:COPILOTIX_AUTHORIZED_UNSIGNED_RELEASE -ne 'true') {
            $signature = Get-AuthenticodeSignature -LiteralPath $remoteFiles[0].FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) { throw "Downloaded Setup Authenticode signature is not valid: $($signature.Status)" }
          }
          & gh release edit $tag --repo $repo --verify-tag --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = (& gh release view $tag --repo $repo --json isDraft | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($published.isDraft) { throw "Release $tag was not published." }
