name: Desktop Windows

on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
  pull_request:
    # The protected master branch requires build for every pull request.
  workflow_dispatch:

# Keep PR merge checks separate from push checks. Never interrupt a master or tag release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # One explicit first-release exception; all other public tags require signing.
  COPILOTIX_INITIAL_UNSIGNED_RELEASE: ${{ github.ref == 'refs/tags/desktop-v1.0.0' && vars.COPILOTIX_UNSIGNED_BOOTSTRAP_RELEASE == 'desktop-v1.0.0' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: node desktop/scripts/verify-release-tag.mjs
      - name: Verify desktop release license
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: node desktop/scripts/verify-release-license.mjs
      - name: Require a signing certificate for a production release
        if: startsWith(github.ref, 'refs/tags/desktop-v') && env.COPILOTIX_INITIAL_UNSIGNED_RELEASE != 'true'
        run: node desktop/scripts/verify-release-signing.mjs
        env:
          COPILOTIX_RELEASE_MODE: production
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:lint
      - run: pnpm desktop:typecheck
      - run: pnpm desktop:test:coverage
      - run: pnpm desktop:build:bundles
      - name: Package verified compact Windows installation bundle
        run: pnpm desktop:release:from-built
        env:
          COPILOTIX_RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && env.COPILOTIX_INITIAL_UNSIGNED_RELEASE != 'true' && 'production' || 'development' }}
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - run: pnpm desktop:test:e2e
      - name: Verify install, upgrade, uninstall and reinstall with isolated data
        shell: pwsh
        run: ./desktop/scripts/test-installer-lifecycle.ps1
      - name: Verify bundle download, integrity, extraction and deletion
        run: pnpm desktop:test:release-download:install
      - name: Select the verified compact release archive
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'release/advanced/release-manifest.json' -Raw | ConvertFrom-Json
          $archive = [IO.Path]::GetFullPath((Join-Path (Join-Path 'release' $manifest.artifactDirectory) $manifest.transport.file))
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Verified compact archive is missing.' }
          "COPILOTIX_RELEASE_ZIP=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Copilotix-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/setup.exe
            release/uninstall.exe
            release/安装说明.txt
            release/advanced/SHA256SUMS.txt
            release/advanced/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: Copilotix-Windows-x64-Bundle
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.COPILOTIX_RELEASE_ZIP }}

      - name: Preserve Windows verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Copilotix-Windows-verification-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            desktop/test-results/
            desktop/unit-test-results/
            desktop/coverage/coverage-summary.json

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          name: Copilotix-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Copilotix-Windows-x64-Bundle
          path: release-bundle
      - name: Create or reuse a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $existingJson = & gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) { throw "Release $tag already exists and is published; refusing to replace it." }
          } else {
            $version = $tag.Substring('desktop-v'.Length)
            $notesPath = Join-Path $env:RUNNER_TEMP 'copilotix-release-notes.md'
            $notes = @(
              "Windows x64: download **Copilotix-$version-win-x64.zip**, extract the entire folder, then run **setup.exe**.",
              '',
              "The compact ZIP contains Setup, uninstall.exe and installation instructions. The complete program is already embedded in Setup. Setup is also available separately.",
              '',
              'Wait for tasks to finish and exit Copilotix from the tray before upgrading. Uninstall preserves data by default; the uninstall wizard offers optional library, settings and credential removal with a second confirmation.',
              '',
              'See docs/WINDOWS_INSTALLATION_ZH.md in the release source for installation and removal details. Verify downloads against SHA256SUMS.txt.'
            ) -join "`n"
            if ($env:COPILOTIX_INITIAL_UNSIGNED_RELEASE -eq 'true') {
              $notes = "**Unsigned initial release:** Copilotix 1.0.0 is published before trusted Windows code signing is available. These binaries are not signed. Later releases require trusted signing.`n`n" + $notes
            }
            [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
            & gh release create $tag --repo $repo --draft --verify-tag --generate-notes --notes-file $notesPath --title "Copilotix $tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload the complete release asset set to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -LiteralPath 'release-bundle' -Recurse -File -Filter 'Copilotix-*-win-x64.zip')
          if ($archives.Count -ne 1) { throw "Expected exactly one Windows x64 ZIP; found $($archives.Count)." }
          $installers = @(Get-ChildItem -LiteralPath 'release' -File -Filter 'setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows x64 Setup; found $($installers.Count)." }
          # Compact ZIP is the primary download; standalone Setup remains available.
          $publicChecksums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          $manifest = Get-Content -LiteralPath 'release/advanced/release-manifest.json' -Raw | ConvertFrom-Json
          if ($archives[0].Name -ne $manifest.transport.file) { throw 'Compact ZIP does not match the release manifest.' }
          if ((Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash -ne $manifest.transport.sha256) { throw 'Compact ZIP hash does not match the release manifest.' }
          $checksums = @(
            "$($manifest.installer.sha256) *$($manifest.installer.file)",
            "$($manifest.transport.sha256) *$($manifest.transport.file)",
            "$($manifest.installer.sha256) *$($manifest.transport.rootDirectory)/$($manifest.installer.file)",
            "$($manifest.uninstaller.sha256) *$($manifest.transport.rootDirectory)/$($manifest.uninstaller.file)"
          ) -join "`n"
          [IO.File]::WriteAllText($publicChecksums, $checksums + "`n", [Text.UTF8Encoding]::new($false))
          $files = @($installers[0].FullName, $archives[0].FullName, $publicChecksums, (Join-Path 'release/advanced' 'release-manifest.json'))
          foreach ($file in $files) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Required release asset missing: $file" } }
          if ($env:COPILOTIX_INITIAL_UNSIGNED_RELEASE -ne 'true') {
            foreach ($installer in $installers) {
              $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
              if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) { throw "Setup Authenticode signature is not valid: $($signature.Status)" }
            }
          }
          $arguments = @('release', 'upload', $env:GITHUB_REF_NAME) + $files + @('--repo', $env:GITHUB_REPOSITORY, '--clobber')
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify all draft assets, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $releaseJson = & gh release view $tag --repo $repo --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release $tag stopped being a draft before asset verification." }
          $env:COPILOTIX_RELEASE_ASSET_NAMES_JSON = ConvertTo-Json -InputObject @($release.assets | ForEach-Object { $_.name }) -Compress
          node desktop/scripts/verify-release-assets.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteAssetDirectory = 'release-remote-assets'
          New-Item -ItemType Directory -Force -Path $remoteAssetDirectory | Out-Null
          & gh release download $tag --repo $repo --dir $remoteAssetDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteFiles = @(Get-ChildItem -LiteralPath $remoteAssetDirectory -File)
          if ($remoteFiles.Count -ne 4) { throw "Expected exactly four downloaded release assets; found $($remoteFiles.Count)." }
          $files = @((Get-ChildItem -LiteralPath 'release' -File -Filter 'setup.exe').FullName, (Get-ChildItem -LiteralPath 'release-bundle' -Recurse -File -Filter 'Copilotix-*-win-x64.zip').FullName, (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'), (Join-Path 'release/advanced' 'release-manifest.json'))
          if ($files.Count -ne 4) { throw 'Local release asset set must contain exactly four files.' }
          foreach ($file in $files) {
            $assetName = Split-Path -Leaf $file
            $remotePath = Join-Path $remoteAssetDirectory $assetName
            if (-not (Test-Path -LiteralPath $remotePath -PathType Leaf)) { throw "Uploaded release asset missing from download: $assetName" }
            $localHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            $remoteHash = (Get-FileHash -LiteralPath $remotePath -Algorithm SHA256).Hash
            if ($localHash -ne $remoteHash) { throw "Uploaded release asset hash mismatch: $assetName" }
            if ($assetName -like 'setup.exe' -and $env:COPILOTIX_INITIAL_UNSIGNED_RELEASE -ne 'true') {
              $signature = Get-AuthenticodeSignature -LiteralPath $remotePath
              if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) { throw "Downloaded Setup Authenticode signature is not valid: $($signature.Status)" }
            }
          }
          & gh release edit $tag --repo $repo --verify-tag --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = (& gh release view $tag --repo $repo --json isDraft | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($published.isDraft) { throw "Release $tag was not published." }
