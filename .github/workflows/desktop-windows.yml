name: Desktop Windows

on:
  push:
    branches: [master]
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:lint
      - run: pnpm desktop:typecheck
      - run: pnpm desktop:test:coverage
      - run: pnpm desktop:build:bundles
      - run: pnpm desktop:release:from-built
      - run: pnpm desktop:test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: MinerU-Windows-x64
          path: |
            release/MinerU-*-win-x64.zip
            release/SHA256SUMS.txt
            release/release-manifest.json
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        with:
          files: |
            release/MinerU-*-win-x64.zip
            release/SHA256SUMS.txt
            release/release-manifest.json
