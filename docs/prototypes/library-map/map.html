<title>文库地形图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a survey sheet. The map is the page; a side ledger explains the selection; the column
   preview below shows how the topics would become 文库 columns. Palette from Copilotix. */
:root {
  --paper: #f7f2e8; --sheet: #fbf8f1; --ink: #2f2a24; --text: #3a342d; --muted: #7d7569; --rule: #dcd4c7;
  --accent: #5b58d6; --accent-soft: #ecebfb;
  --h0: #5b58d6; --h1: #2f8a76; --h2: #c0832a; --h3: #b4513d; --h4: #8a5a9e; --h5: #4f7ca8; --h6: #7d8a3a;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gutter: clamp(16px, 3vw, 40px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1c1915; --sheet: #24201b; --ink: #efe8db; --text: #ddd5c7; --muted: #a39a8c; --rule: #3b352d;
  --accent: #9d9af5; --accent-soft: #2c2a4a;
  --h0: #9d9af5; --h1: #5cc0a6; --h2: #e3aa55; --h3: #e07e66; --h4: #c09ad3; --h5: #82acd6; --h6: #b3c06a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1c1915; --sheet: #24201b; --ink: #efe8db; --text: #ddd5c7; --muted: #a39a8c; --rule: #3b352d;
  --accent: #9d9af5; --accent-soft: #2c2a4a;
  --h0: #9d9af5; --h1: #5cc0a6; --h2: #e3aa55; --h3: #e07e66; --h4: #c09ad3; --h5: #82acd6; --h6: #b3c06a; color-scheme: dark }

body { background: var(--paper); color: var(--text); font: 14px/1.6 var(--sans); }
.page { display: grid; gap: 22px; padding-inline: var(--gutter); padding-block: 26px 40px; max-width: 1440px; margin: 0 auto; }
.eyebrow, .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 32px; }
header.top h1 { margin: 4px 0 0; color: var(--ink); font-size: clamp(28px, 3.4vw, 42px); font-weight: 700; letter-spacing: .06em; line-height: 1.1; text-wrap: balance; }
header.top p { margin: 6px 0 0; max-width: 62ch; color: var(--muted); }

/* Pipeline: the actual steps and counts of this build. */
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-block: 1px solid var(--rule); }
.pipeline li { list-style: none; display: grid; gap: 2px; padding: 12px 14px; border-left: 1px solid var(--rule); min-width: 0; }
.pipeline li:first-child { border-left: 0; padding-left: 0; }
.pipeline strong { color: var(--ink); font: 500 22px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.pipeline span:last-child { color: var(--muted); font-size: 12px; }
.pipeline ol { display: contents; }

.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.map-frame { position: relative; min-width: 0; background: var(--sheet); border: 1px solid var(--rule); }
.map-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.map-tools label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text); cursor: pointer; }
.map-tools input[type="checkbox"] { accent-color: var(--accent); }
.map-tools .spacer { flex: 1; }
.map-tools button { border: 1px solid var(--rule); background: transparent; color: var(--text); font: 12px var(--sans); padding: 3px 10px; cursor: pointer; }
.map-tools button:hover, .map-tools button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
svg#map { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 640; touch-action: none; cursor: grab; }
svg#map:active { cursor: grabbing; }
.grid line { stroke: var(--rule); stroke-width: .6; }
.grid text { fill: var(--muted); font: 9px var(--mono); }
.contour { fill-opacity: .045; stroke-opacity: .55; stroke-width: .7; }
.contour.peak { stroke-width: 1.2; stroke-opacity: .85; }
.region-outline { fill: none; stroke: var(--ink); stroke-opacity: .45; stroke-width: 1; stroke-dasharray: 2 5; }
.region-label { fill: var(--ink); font: 500 11px var(--mono); letter-spacing: .16em; }
.island-label { font: 700 13px var(--sans); letter-spacing: .12em; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; }
.island-terms { fill: var(--muted); font: 10px var(--mono); paint-order: stroke; stroke: var(--sheet); stroke-width: 3px; }
.dust { fill: var(--ink); fill-opacity: .28; }
.dust.hit { fill: var(--accent); fill-opacity: 1; }
.dust.near { fill: var(--accent); fill-opacity: .8; }
.dust-hit-ring { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.semantic { stroke: var(--ink); fill: none; }
.cite { fill: none; stroke-width: 1.4; stroke-dasharray: 5 5; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -20; } }
.chunk-link { stroke: var(--accent); stroke-width: 1; stroke-opacity: .7; fill: none; }
.paper-dot { fill: var(--sheet); stroke-width: 2.2; cursor: pointer; }
.paper-cross { stroke: var(--ink); stroke-width: 1; }
.paper-label { fill: var(--ink); font: 500 11.5px var(--sans); paint-order: stroke; stroke: var(--sheet); stroke-width: 3.5px; pointer-events: none; }
.paper:focus-visible .paper-dot { stroke: var(--accent); stroke-width: 4; }
.paper { outline: none; }
.dimmed { opacity: .18; transition: opacity .2s; }
.legend-scale { position: absolute; left: 14px; bottom: 10px; pointer-events: none; }
.tooltip { position: absolute; z-index: 2; max-width: 300px; padding: 8px 10px; background: var(--ink); color: var(--paper); font-size: 12px; line-height: 1.5; pointer-events: none; }
.tooltip .mono { color: color-mix(in srgb, var(--paper) 70%, transparent); }

/* Ledger: what is selected and why. */
aside.ledger { display: grid; gap: 16px; min-width: 0; }
.ledger section { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--rule); }
.ledger h2 { margin: 0; color: var(--ink); font-size: 18px; line-height: 1.35; text-wrap: balance; }
.ledger h3 { margin: 0; color: var(--ink); font-size: 13px; }
.ledger p { margin: 0; }
.ask { display: grid; gap: 8px; }
.ask form { display: flex; border-bottom: 1px solid var(--ink); }
.ask input { flex: 1; min-width: 0; padding: 8px 2px; border: 0; background: transparent; color: var(--ink); font: 14px var(--sans); }
.ask input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ask button[type="submit"] { border: 0; background: transparent; color: var(--accent); font: 500 13px var(--sans); cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--rule); background: transparent; color: var(--text); font: 12px var(--sans); padding: 3px 8px; cursor: pointer; }
.chips button:hover, .chips button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.legend { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px; align-items: start; }
.swatch { width: 12px; height: 12px; margin-top: 4px; border: 2px solid currentColor; border-radius: 50%; }
.legend strong { color: var(--ink); font-weight: 500; }
.legend small { display: block; color: var(--muted); font: 11px var(--mono); }
.rank { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.rank li { display: grid; gap: 3px; }
.rank .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink); }
.rank .row span:last-child { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--rule); }
.bar i { display: block; height: 100%; background: var(--accent); }
.snippet { color: var(--text); font-size: 12.5px; }
.terms { display: flex; flex-wrap: wrap; gap: 5px; }
.terms span { padding: 1px 6px; background: var(--accent-soft); color: var(--ink); font: 11.5px var(--mono); }
.terms span.shared { background: var(--accent); color: var(--sheet); }
.link-button { justify-self: start; border: 0; padding: 0; background: none; color: var(--accent); font: 12.5px var(--sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Column preview. */
.columns h2 { margin: 0 0 4px; color: var(--ink); font-size: 18px; }
.columns > p { margin: 0 0 14px; color: var(--muted); max-width: 70ch; }
.column-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.column { display: grid; gap: 10px; align-content: start; padding: 14px; background: var(--sheet); border: 1px solid var(--rule); min-width: 0; }
.column header { display: grid; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.column header strong { color: var(--ink); font-size: 15px; }
.column ol { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.column li button { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 9px; width: 100%; padding: 6px 4px; border: 0; background: transparent; color: var(--text); text-align: left; font: 13px/1.45 var(--sans); cursor: pointer; }
.column li button:hover, .column li button:focus-visible { background: var(--accent-soft); outline: none; }
.column li i { width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: currentColor; }
.column .island-head { color: var(--muted); font: 11px var(--mono); letter-spacing: .08em; margin-top: 4px; }
footer.note { color: var(--muted); font-size: 12px; max-width: 80ch; }

@media (max-width: 980px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pipeline li:nth-child(odd) { border-left: 0; padding-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .cite { animation: none; } .dimmed { transition: none; } }
</style>

<div class="page">
  <header class="top">
    <div>
      <span class="eyebrow">Copilotix · Library Survey</span>
      <h1>文库地形图</h1>
      <p>每篇论文切成段落、变成向量，再按内容的远近聚成主题岛。等高线越密，论文之间越相似；虚线航线是论文之间真实的引用。</p>
    </div>
    <span class="mono" id="stamp"></span>
  </header>

  <ol class="pipeline" id="pipeline" aria-label="处理步骤"></ol>

  <div class="workspace">
    <div class="map-frame">
      <div class="map-tools" role="group" aria-label="图层">
        <label><input type="checkbox" id="layer-contours" checked>主题等高线</label>
        <label><input type="checkbox" id="layer-cites" checked>引用航线</label>
        <label><input type="checkbox" id="layer-semantic">语义近邻</label>
        <label><input type="checkbox" id="layer-dust" checked>切块星尘</label>
        <span class="spacer"></span>
        <button type="button" id="reset-view">复位视图</button>
      </div>
      <svg id="map" viewBox="0 0 1000 640" role="img" aria-label="论文主题地图"></svg>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>

    <aside class="ledger" aria-live="polite">
      <div class="ask">
        <span class="eyebrow">问文库 · 检索演示</span>
        <form id="ask-form" role="search">
          <input id="ask-input" type="search" placeholder="例如：注意力机制如何求解偏微分方程" autocomplete="off" aria-label="向文库提问">
          <button type="submit">检索</button>
        </form>
        <div class="chips" id="examples"></div>
      </div>
      <div id="ledger-body"></div>
    </aside>
  </div>

  <section class="columns" aria-labelledby="columns-title">
    <h2 id="columns-title">如果文库按主题分列</h2>
    <p>区域就是文库页的一列，列内按主题岛分段，岛内论文按与主题中心的接近程度排序。点击论文可在地图上定位。</p>
    <div class="column-grid" id="columns"></div>
  </section>

  <footer class="note" id="note"></footer>
</div>

<script type="application/json" id="map-data">/*MAP_DATA*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('map-data').textContent)
  const W = 1000, H = 640, PAD = 70
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
  const hue = (index) => `var(--h${index % 7})`
  const papers = DATA.papers, chunks = DATA.chunks, topics = DATA.topics, regions = DATA.regions
  const regionLetter = (index) => String.fromCharCode(65 + index)
  const shortTitle = (title) => title.split(/[：:（(]/u)[0].slice(0, 16)
  const islandName = (topic) => topic.terms.slice(0, 3).join(' · ')
  const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s }
  const normalize = (a) => { const n = Math.sqrt(dot(a, a)) || 1; return a.map((v) => v / n) }

  // ── Header numbers come from this build. ──
  const steps = [
    [papers.length, '篇论文', '解析后的中文 Markdown'],
    [chunks.length, '个切块', `按段落合并到约 ${DATA.method.chunkChars} 字`],
    [DATA.method.lsaDimensions, '维向量', `TF-IDF（${DATA.method.vocabulary} 词）→ LSA`],
    [`${topics.length}/${regions.length}`, '主题岛 / 区域', '层次聚类 + 轮廓系数'],
    [DATA.citations.length, '条引用', '参考文献匹配库内标题']
  ]
  document.getElementById('pipeline').innerHTML = steps.map(([n, unit, how]) => `<li><span class="mono">${unit}</span><strong>${n}</strong><span>${how}</span></li>`).join('')
  document.getElementById('stamp').textContent = `生成于 ${DATA.generatedAt.slice(0, 10)}`
  document.getElementById('note').textContent = `演示版：向量来自本地 TF-IDF + LSA，主题名由 c-TF-IDF 关键词拼出，均可离线复现。正式版建议换成多语种嵌入模型生成向量、由大模型为主题命名；各轮廓系数 ${DATA.method.silhouette.map((s) => `k=${s.k}:${s.silhouette}`).join('，')}。`

  // ── Layout: classical MDS on 1 − cosine, refined with a force pass that keeps islands together. ──
  const n = papers.length
  const D2 = papers.map((_, i) => papers.map((_, j) => (1 - DATA.similarity[i][j]) ** 2))
  const rowMean = D2.map((row) => d3.mean(row)), all = d3.mean(rowMean)
  const B = D2.map((row, i) => row.map((v, j) => -0.5 * (v - rowMean[i] - rowMean[j] + all)))
  const power = (M, deflate) => {
    let v = M.map((_, i) => Math.sin(i * 1.7 + (deflate ? 2 : 1)))
    for (let it = 0; it < 200; it++) {
      let w = M.map((row) => dot(row, v))
      if (deflate) { const p = dot(w, deflate.v); w = w.map((x, i) => x - p * deflate.v[i]) }
      v = normalize(w)
    }
    return { v, value: dot(v, M.map((row) => dot(row, v))) }
  }
  const e1 = power(B), e2 = power(B, e1)
  const nodes = papers.map((p, i) => ({ i, x: e1.v[i] * Math.sqrt(Math.max(e1.value, 1e-6)), y: e2.v[i] * Math.sqrt(Math.max(e2.value, 1e-6)) }))
  // Fill the sheet: each axis scales on its own, within 1.8× of the other so distances stay readable.
  const fit = (items, padX = PAD + 40, padY = PAD) => {
    const xs = d3.extent(items, (d) => d.x), ys = d3.extent(items, (d) => d.y)
    let sx = (W - 2 * padX) / (xs[1] - xs[0] || 1), sy = (H - 2 * padY) / (ys[1] - ys[0] || 1)
    sx = Math.min(sx, sy * 1.8); sy = Math.min(sy, sx * 1.8)
    const ox = (W - sx * (xs[1] - xs[0])) / 2, oy = (H - sy * (ys[1] - ys[0])) / 2
    items.forEach((d) => { d.x = ox + (d.x - xs[0]) * sx; d.y = oy + (d.y - ys[0]) * sy })
  }
  fit(nodes)
  const centroid = (list) => ({ x: d3.mean(list, (d) => d.x), y: d3.mean(list, (d) => d.y) })
  const links = []
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (DATA.similarity[i][j] > 0.15) links.push({ source: i, target: j, s: DATA.similarity[i][j] })
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).strength((l) => l.s * 0.25).distance((l) => 90 + (1 - l.s) * 260))
    .force('charge', d3.forceManyBody().strength(-260))
    .force('collide', d3.forceCollide(72))
    .force('islandX', d3.forceX((d) => centroid(nodes.filter((o) => papers[o.i].topic === papers[d.i].topic)).x).strength(0.12))
    .force('islandY', d3.forceY((d) => centroid(nodes.filter((o) => papers[o.i].topic === papers[d.i].topic)).y).strength(0.12))
    .stop()
  for (let t = 0; t < 320; t++) sim.tick()
  fit(nodes)

  // Chunk dust: each chunk sits near its paper, drawn toward papers it reads like.
  const centroids = papers.map((_, p) => normalize(chunks.filter((c) => c.paper === p).reduce((sum, c) => sum.map((v, d) => v + c.vector[d]), new Array(DATA.method.lsaDimensions).fill(0))))
  const random = d3.randomLcg(7)
  chunks.forEach((c, index) => {
    const scores = centroids.map((v) => Math.exp(dot(c.vector, v) * 9))
    const total = d3.sum(scores)
    const pull = { x: d3.sum(nodes, (d, k) => d.x * scores[k]) / total, y: d3.sum(nodes, (d, k) => d.y * scores[k]) / total }
    const home = nodes[c.paper]
    const angle = random() * Math.PI * 2, radius = 10 + Math.sqrt(random()) * 34
    c.x = home.x + (pull.x - home.x) * 0.42 + Math.cos(angle) * radius
    c.y = home.y + (pull.y - home.y) * 0.42 + Math.sin(angle) * radius
    c.index = index
  })

  // ── Drawing. ──
  const svg = d3.select('#map')
  const root = svg.append('g')
  const defs = svg.append('defs')
  topics.forEach((_, t) => defs.append('marker').attr('id', `arrow-${t}`).attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5)
    .attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto-start-reverse')
    .append('path').attr('d', 'M0,0L10,5L0,10z').attr('fill', hue(t)))

  // Survey grid with coordinates, like a sheet map.
  const grid = root.append('g').attr('class', 'grid')
  for (let x = 0; x <= W; x += 100) { grid.append('line').attr('x1', x).attr('x2', x).attr('y1', 0).attr('y2', H); grid.append('text').attr('x', x + 3).attr('y', 11).text(`E${String(x / 10).padStart(3, '0')}`) }
  for (let y = 0; y <= H; y += 80) { grid.append('line').attr('x1', 0).attr('x2', W).attr('y1', y).attr('y2', y); grid.append('text').attr('x', 3).attr('y', y - 3).text(`N${String(y / 8).padStart(3, '0')}`) }

  const contourLayer = root.append('g')
  const regionLayer = root.append('g')
  const semanticLayer = root.append('g')
  const dustLayer = root.append('g')
  const citeLayer = root.append('g')
  const chunkLinkLayer = root.append('g')
  const paperLayer = root.append('g')
  const labelLayer = root.append('g')

  const pointsFor = (filter) => [
    ...nodes.filter((d) => filter(papers[d.i])).map((d) => ({ x: d.x, y: d.y, w: 40 })),
    ...chunks.filter((c) => filter(papers[c.paper])).map((c) => ({ x: c.x, y: c.y, w: 1 }))
  ]
  topics.forEach((topic, t) => {
    const density = d3.contourDensity().x((d) => d.x).y((d) => d.y).weight((d) => d.w).size([W, H]).bandwidth(26).thresholds(9)(pointsFor((p) => p.topic === t))
    contourLayer.append('g').selectAll('path').data(density).join('path')
      .attr('class', (_, k) => `contour${k === density.length - 1 ? ' peak' : ''}`)
      .attr('d', d3.geoPath()).attr('fill', hue(t)).attr('stroke', hue(t))
  })
  regions.forEach((region, r) => {
    const outline = d3.contourDensity().x((d) => d.x).y((d) => d.y).weight((d) => d.w).size([W, H]).bandwidth(48).thresholds(6)(pointsFor((p) => p.region === r))
    const shape = outline.length && outline[0].coordinates.length ? outline[0] : null
    if (!shape) return
    regionLayer.append('path').attr('class', 'region-outline').attr('d', d3.geoPath()(shape))
    const bounds = d3.geoPath().bounds(shape)
    regionLayer.append('text').attr('class', 'region-label').attr('x', Math.max(8, bounds[0][0] + 6)).attr('y', Math.max(22, bounds[0][1] - 6))
      .text(`区域 ${regionLetter(r)} · ${region.terms.slice(0, 2).join(' / ')}`)
  })

  topics.forEach((topic, t) => {
    const c = centroid(nodes.filter((d) => papers[d.i].topic === t))
    const top = d3.min(nodes.filter((d) => papers[d.i].topic === t), (d) => d.y)
    const label = labelLayer.append('g').attr('transform', `translate(${c.x},${Math.max(40, top - 34)})`).attr('text-anchor', 'middle')
    label.append('text').attr('class', 'island-label').attr('fill', hue(t)).text(`岛 ${String(t + 1).padStart(2, '0')}`)
    label.append('text').attr('class', 'island-terms').attr('y', 14).text(islandName(topic))
  })

  const semanticEdges = []
  papers.forEach((_, i) => DATA.similarity[i].map((s, j) => [j, s]).filter(([j]) => j !== i).sort((a, b) => b[1] - a[1]).slice(0, 2)
    .forEach(([j, s]) => { if (s > 0.1 && !semanticEdges.some((e) => e.a === j && e.b === i)) semanticEdges.push({ a: i, b: j, s }) }))
  const semanticSel = semanticLayer.selectAll('line').data(semanticEdges).join('line').attr('class', 'semantic')
    .attr('x1', (e) => nodes[e.a].x).attr('y1', (e) => nodes[e.a].y).attr('x2', (e) => nodes[e.b].x).attr('y2', (e) => nodes[e.b].y)
    .attr('stroke-width', (e) => 0.5 + e.s * 2.5).attr('stroke-opacity', (e) => 0.15 + e.s * 0.5)

  const dustSel = dustLayer.selectAll('circle').data(chunks).join('circle').attr('class', 'dust')
    .attr('cx', (c) => c.x).attr('cy', (c) => c.y).attr('r', (c) => (c.role === 'abstract' ? 2.2 : 1.4))

  const arc = (a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1
    const ux = dx / len, uy = dy / len
    const start = { x: a.x + ux * 12, y: a.y + uy * 12 }, end = { x: b.x - ux * 14, y: b.y - uy * 14 }
    const mx = (start.x + end.x) / 2 - uy * len * 0.2, my = (start.y + end.y) / 2 + ux * len * 0.2
    return `M${start.x},${start.y}Q${mx},${my} ${end.x},${end.y}`
  }
  const citeSel = citeLayer.selectAll('path').data(DATA.citations).join('path').attr('class', 'cite')
    .attr('d', (c) => arc(nodes[c.from], nodes[c.to])).attr('stroke', (c) => hue(papers[c.from].topic)).attr('marker-end', (c) => `url(#arrow-${papers[c.from].topic})`)

  const paperSel = paperLayer.selectAll('g').data(nodes).join('g').attr('class', 'paper').attr('tabindex', 0)
    .attr('role', 'button').attr('aria-label', (d) => papers[d.i].title).attr('transform', (d) => `translate(${d.x},${d.y})`)
  paperSel.append('line').attr('class', 'paper-cross').attr('x1', -13).attr('x2', 13)
  paperSel.append('line').attr('class', 'paper-cross').attr('y1', -13).attr('y2', 13)
  paperSel.append('circle').attr('class', 'paper-dot').attr('r', (d) => 5 + Math.sqrt(papers[d.i].chunks) * 0.55).attr('stroke', (d) => hue(papers[d.i].topic))
  // Labels: try right-above, right-below, left-above, left-below and keep the first free slot.
  const placed = []
  const slots = [[14, -10, 'start'], [14, 20, 'start'], [-14, -10, 'end'], [-14, 20, 'end']]
  nodes.slice().sort((a, b) => a.y - b.y).forEach((d) => {
    const text = shortTitle(papers[d.i].title)
    const width = text.length * 11.5
    const box = ([dx, dy, anchor]) => { const x0 = d.x + dx - (anchor === 'end' ? width : 0); return { x0, x1: x0 + width, y0: d.y + dy - 12, y1: d.y + dy + 3 } }
    const free = (b) => b.x0 > 4 && b.x1 < W - 4 && !placed.some((o) => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0)
    const slot = slots.find((candidate) => free(box(candidate))) ?? slots[0]
    placed.push(box(slot))
    d.label = { text, dx: slot[0], dy: slot[1], anchor: slot[2] }
  })
  paperSel.append('text').attr('class', 'paper-label').attr('x', (d) => d.label.dx).attr('y', (d) => d.label.dy).attr('text-anchor', (d) => d.label.anchor).text((d) => d.label.text)

  // ── Zoom and pan. ──
  const zoom = d3.zoom().scaleExtent([0.8, 6]).on('zoom', (event) => root.attr('transform', event.transform))
  svg.call(zoom)
  document.getElementById('reset-view').addEventListener('click', () => svg.transition().duration(reduced ? 0 : 400).call(zoom.transform, d3.zoomIdentity))
  const focusOn = (point, scale = 1.8) => svg.transition().duration(reduced ? 0 : 600).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(scale).translate(-point.x, -point.y))

  // ── Layers. ──
  const toggle = (id, layer) => { const box = document.getElementById(id); const apply = () => layer.style('display', box.checked ? null : 'none'); box.addEventListener('change', apply); apply() }
  toggle('layer-contours', contourLayer); toggle('layer-cites', citeLayer); toggle('layer-semantic', semanticLayer); toggle('layer-dust', dustLayer)

  // ── Tooltip for chunks: show the passage and what it would retrieve from other papers. ──
  const tooltip = document.getElementById('tooltip')
  const frame = document.querySelector('.map-frame')
  const escape = (text) => text.replace(/[&<>"]/gu, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  dustSel.on('pointerenter', (event, c) => {
    chunkLinkLayer.selectAll('*').remove()
    chunkLinkLayer.selectAll('line').data(c.neighbours).join('line').attr('class', 'chunk-link')
      .attr('x1', c.x).attr('y1', c.y).attr('x2', ([k]) => chunks[k].x).attr('y2', ([k]) => chunks[k].y)
    dustSel.classed('near', (o) => c.neighbours.some(([k]) => k === o.index))
    const near = c.neighbours.map(([k, s]) => `${shortTitle(papers[chunks[k].paper].title)} ${Math.round(s * 100)}%`).join(' · ')
    tooltip.innerHTML = `<div class="mono">${escape(shortTitle(papers[c.paper].title))} / ${escape(c.section || '正文')}</div>${escape(c.text)}…<div class="mono" style="margin-top:6px">最近的他文切块：${escape(near)}</div>`
    tooltip.hidden = false
  }).on('pointermove', (event) => {
    const box = frame.getBoundingClientRect()
    tooltip.style.left = `${Math.min(event.clientX - box.left + 14, box.width - 310)}px`
    tooltip.style.top = `${event.clientY - box.top + 14}px`
  }).on('pointerleave', () => {
    tooltip.hidden = true
    chunkLinkLayer.selectAll('*').remove()
    dustSel.classed('near', false)
  })

  // ── Ledger. ──
  const body = document.getElementById('ledger-body')
  const neighboursOf = (i) => DATA.similarity[i].map((s, j) => [j, s]).filter(([j]) => j !== i).sort((a, b) => b[1] - a[1])
  const highlight = (set) => {
    const on = set ? (i) => set.has(i) : () => true
    paperSel.classed('dimmed', (d) => !on(d.i))
    citeSel.classed('dimmed', (c) => set && !(set.has(c.from) && set.has(c.to)))
    semanticSel.classed('dimmed', (e) => set && !(set.has(e.a) && set.has(e.b)))
    dustSel.classed('dimmed', (c) => set && !set.has(c.paper))
  }
  function showOverview() {
    highlight(null)
    dustSel.classed('hit', false)
    labelLayer.selectAll('.dust-hit-ring').remove()
    body.innerHTML = `<section><span class="eyebrow">主题岛</span><ul class="legend">${topics.map((t, k) => `<li style="color:${hue(k)}"><span class="swatch"></span><span><strong>岛 ${String(k + 1).padStart(2, '0')} · ${escape(islandName(t))}</strong><small>${t.papers.length} 篇 · 区域 ${regionLetter(papers[t.papers[0]].region)}</small></span></li>`).join('')}</ul></section>
      <section><span class="eyebrow">怎么读</span><p>十字点是论文，越大切块越多；灰色细点是切块，偏向哪篇论文就说明那一段读起来像哪篇。悬停切块看原文和它在别的论文里最近的段落；点击论文看它为什么被分到这里。</p></section>`
  }
  function showPaper(i) {
    const p = papers[i]
    const near = neighboursOf(i).slice(0, 4)
    const cites = DATA.citations.filter((c) => c.from === i).map((c) => c.to)
    const citedBy = DATA.citations.filter((c) => c.to === i).map((c) => c.from)
    highlight(new Set([i, ...near.slice(0, 2).map(([j]) => j), ...cites, ...citedBy]))
    const share = new Set(near.slice(0, 2).flatMap(([j]) => papers[j].terms))
    const topChunks = chunks.filter((c) => c.paper === i).map((c) => [c, dot(c.vector, centroids[i])]).sort((a, b) => b[1] - a[1]).slice(0, 2)
    const listPapers = (list) => list.length ? list.map((j) => `<button type="button" class="link-button" data-paper="${j}">${escape(shortTitle(papers[j].title))}</button>`).join(' ') : '<span class="mono">库内无</span>'
    body.innerHTML = `<section><span class="eyebrow" style="color:${hue(p.topic)}">岛 ${String(p.topic + 1).padStart(2, '0')} · 区域 ${regionLetter(p.region)}</span>
        <h2>${escape(p.title)}</h2><p class="mono" style="text-transform:none;letter-spacing:.02em">${escape(p.original)}</p>
        <div class="terms">${p.terms.map((t) => `<span class="${share.has(t) ? 'shared' : ''}">${escape(t)}</span>`).join('')}</div>
        <p class="mono" style="text-transform:none;letter-spacing:.02em">深色词也出现在最近的两篇论文里</p></section>
      <section><h3>最相近的论文</h3><ol class="rank">${near.map(([j, s]) => `<li><div class="row"><button type="button" class="link-button" data-paper="${j}">${escape(shortTitle(papers[j].title))}</button><span>${Math.round(Math.max(0, s) * 100)}%</span></div><div class="bar"><i style="width:${Math.max(0, s) * 100}%"></i></div></li>`).join('')}</ol></section>
      <section><h3>引用</h3><p>它引用：${listPapers(cites)}</p><p>被引用：${listPapers(citedBy)}</p></section>
      <section><h3>最能代表它的段落</h3>${topChunks.map(([c]) => `<p class="snippet"><span class="mono">${escape(c.section || '正文')}</span><br>${escape(c.text)}…</p>`).join('')}
        <button type="button" class="link-button" data-overview>返回总览</button></section>`
    focusOn(nodes[i], 1.6)
  }
  paperSel.on('click', (_, d) => showPaper(d.i)).on('keydown', (event, d) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showPaper(d.i) } })
  body.addEventListener('click', (event) => {
    const target = event.target.closest('[data-paper],[data-overview]')
    if (!target) return
    if (target.dataset.overview !== undefined) { showOverview(); svg.transition().duration(reduced ? 0 : 400).call(zoom.transform, d3.zoomIdentity) } else showPaper(Number(target.dataset.paper))
  })

  // ── Ask: fold the question into the same vector space and rank passages (the retrieval half of RAG). ──
  const STOP_CJK = new Set('我们 一个 一种 可以 以及 通过 使用 进行 由于 因此 其中 这些 这个 我们的 的是 是一 在一 了一 中的 上的 和的 为了 对于 如图 如表 所示 表示 图中 方法 模型 结果 本文 论文 提出 不同 相同 以下 以上 之间 他们 它们 没有 已经 能够 需要 非常 每个 所有 包括 例如 其他 时间 情况 部分 如何 什么 怎么 哪些'.split(' '))
  const termIndex = new Map(DATA.query.terms.map((t, k) => [t, k]))
  const segmenter = new Intl.Segmenter('zh', { granularity: 'word' })
  const tokens = (text) => {
    const out = [...(text.toLowerCase().match(/[a-z][a-z-]{2,}/gu) ?? [])]
    for (const run of text.match(/[一-鿿]{2,}/gu) ?? []) {
      let singles = ''
      const flush = () => { if (singles.length >= 2 && singles.length <= 5) out.push(singles); else for (let k = 0; k + 1 < singles.length; k++) out.push(singles.slice(k, k + 2)); singles = '' }
      for (const { segment } of segmenter.segment(run)) {
        if (!/^[一-鿿]+$/u.test(segment)) continue
        if (segment.length === 1) { singles += segment; continue }
        flush(); if (!STOP_CJK.has(segment)) out.push(segment)
      }
      flush()
    }
    return out
  }
  function ask(question) {
    const counts = d3.rollup(tokens(question).filter((t) => termIndex.has(t)), (v) => v.length, (t) => t)
    if (!counts.size) {
      body.innerHTML = `<section><h3>没有可检索的词</h3><p>这些词没有出现在文库里。换一种说法，或用论文里的术语，例如“注意力”“算子”“扩散”。</p><button type="button" class="link-button" data-overview>返回总览</button></section>`
      return
    }
    const q = new Array(DATA.method.lsaDimensions).fill(0)
    for (const [term, count] of counts) { const k = termIndex.get(term); const w = (1 + Math.log(count)) * DATA.query.idf[k]; DATA.query.loadings[k].forEach((v, d) => { q[d] += v * w }) }
    const qv = normalize(q)
    const ranked = chunks.map((c) => [c, dot(c.vector, qv)]).sort((a, b) => b[1] - a[1]).slice(0, 8)
    const byPaper = d3.rollups(ranked, (v) => d3.max(v, ([, s]) => s), ([c]) => c.paper).sort((a, b) => b[1] - a[1])
    highlight(new Set(byPaper.map(([p]) => p)))
    const hits = new Set(ranked.map(([c]) => c.index))
    dustSel.classed('hit', (c) => hits.has(c.index)).classed('dimmed', false)
    labelLayer.selectAll('.dust-hit-ring').remove()
    labelLayer.selectAll('.dust-hit-ring').data(ranked).join('circle').attr('class', 'dust-hit-ring').attr('cx', ([c]) => c.x).attr('cy', ([c]) => c.y).attr('r', 7)
    body.innerHTML = `<section><span class="eyebrow">检索到的段落 · 用到的词：${escape([...counts.keys()].join(' '))}</span>
      <ol class="rank">${ranked.map(([c, s]) => `<li><div class="row"><button type="button" class="link-button" data-paper="${c.paper}">${escape(shortTitle(papers[c.paper].title))}</button><span>${Math.round(Math.max(0, s) * 100)}%</span></div><div class="bar"><i style="width:${Math.max(0, s) * 100}%"></i></div><p class="snippet"><span class="mono">${escape(c.section || '正文')}</span><br>${escape(c.text)}…</p></li>`).join('')}</ol>
      <p class="mono" style="text-transform:none;letter-spacing:.02em">问答会把这些段落连同问题交给模型；地图上的圆圈就是它们的位置。</p>
      <button type="button" class="link-button" data-overview>返回总览</button></section>`
    const best = chunks[ranked[0][0].index]
    focusOn(best, 1.4)
  }
  const input = document.getElementById('ask-input')
  document.getElementById('ask-form').addEventListener('submit', (event) => { event.preventDefault(); if (input.value.trim()) ask(input.value.trim()) })
  const examples = ['注意力机制如何求解偏微分方程', '扩散模型的训练目标', '蛋白质结构预测的精度', '图网络模拟流体粒子']
  document.getElementById('examples').innerHTML = examples.map((e) => `<button type="button">${e}</button>`).join('')
  document.getElementById('examples').addEventListener('click', (event) => { const b = event.target.closest('button'); if (b) { input.value = b.textContent; ask(b.textContent) } })

  // ── Column preview: regions become columns, islands become sections. ──
  document.getElementById('columns').innerHTML = regions.map((region, r) => {
    const islands = region.islands.map((t) => {
      const ordered = topics[t].papers.slice()
      const centre = normalize(topics[t].papers.reduce((sum, p) => sum.map((v, d) => v + papers[p].vector[d]), new Array(papers[0].vector.length).fill(0)))
      ordered.sort((a, b) => dot(papers[b].vector, centre) - dot(papers[a].vector, centre))
      return `<div class="island-head" style="color:${hue(t)}">岛 ${String(t + 1).padStart(2, '0')} · ${escape(islandName(topics[t]))}</div><ol>${ordered.map((p) => `<li><button type="button" data-paper="${p}" style="color:${hue(t)}"><i></i><span style="color:var(--text)">${escape(papers[p].title)}</span></button></li>`).join('')}</ol>`
    }).join('')
    return `<article class="column"><header><span class="mono">COLUMN ${String(r + 1).padStart(2, '0')} · 区域 ${regionLetter(r)}</span><strong>${escape(region.terms.slice(0, 3).join(' / '))}</strong><span class="mono">${region.papers.length} 篇</span></header>${islands}</article>`
  }).join('')
  document.getElementById('columns').addEventListener('click', (event) => {
    const b = event.target.closest('[data-paper]')
    if (!b) return
    showPaper(Number(b.dataset.paper))
    document.querySelector('.map-frame').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' })
  })

  showOverview()
})()
</script>
