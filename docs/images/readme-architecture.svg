<g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#182c48"><text x="44" y="52" font-size="26" font-weight="700">界面、网络与本地计算，各有明确边界</text><text x="44" y="84" font-size="15" fill="#52677d">四个构建入口 · Preload 为隔离桥接脚本 · 主数据保存在本地</text>
<rect x="35" y="110" width="850" height="485" rx="17" fill="#fff" stroke="#d5dfea"/>
<text x="58" y="142" font-size="14" fill="#64748b">WINDOWS DESKTOP</text>
