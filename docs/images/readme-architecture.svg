<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Copilotix 桌面架构</title><desc id="desc">Renderer 经 Preload 桥接到 Main，Main 通过 Core RPC 调度 Utility，并访问外部解析翻译服务。Utility 管理 SQLite 与本地文档产物。Preload 不是独立进程。</desc>
<defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
