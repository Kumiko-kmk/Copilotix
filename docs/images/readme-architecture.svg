<rect x="930" y="185" width="230" height="110" rx="12" fill="#fff" stroke="#c5d1df"/><rect x="930" y="370" width="230" height="108" rx="12" fill="#fff" stroke="#c5d1df"/></g>
<g text-anchor="middle" font-size="23" font-weight="600"><text x="160" y="227">Renderer</text><text x="410" y="227">Preload</text><text x="697" y="227">Main</text><text x="697" y="412">Utility</text><text x="160" y="412">SQLite</text><text x="410" y="412">文档产物</text><text x="1045" y="227">MinerU</text><text x="1045" y="412">翻译服务</text></g>
<g text-anchor="middle" font-size="15" fill="#52677d"><text x="160" y="262">React · 阅读与设置</text><text x="410" y="262">领域 API · 校验</text><text x="697" y="262">窗口 · 凭据 · 网络 · 调度</text><text x="697" y="447">持久化 · 文件 · 本地计算</text><text x="160" y="447">任务与应用数据</text><text x="410" y="447">PDF / Markdown / 图片</text><text x="1045" y="262">PDF 解析</text><text x="1045" y="447">文本与表格翻译</text></g>
